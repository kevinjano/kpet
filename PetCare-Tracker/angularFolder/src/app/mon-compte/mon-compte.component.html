<nav class="kpet-nav-simple">
  <div class="container d-flex align-items-center justify-content-between py-2 flex-wrap gap-2">
    <a class="kpet-logo-text-sm" routerLink="/">
      <img *ngIf="logoUrl; else compteLogoText" [src]="resolveImageUrl(logoUrl)" alt="Kpet" class="account-logo-img">
      <ng-template #compteLogoText>Kpet<span class="dot">.</span></ng-template>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a class="account-nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Tienda</a>
      <a class="account-nav-link" routerLink="/mon-compte" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Mi perfil</a>
    </div>
  </div>
</nav>

<div class="profile-page">
  <div class="container">

    <div class="profile-hero kpet-fade-up">
      <div class="profile-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div>
        <h1 class="profile-name">{{ selectedUser?.firstName }} {{ selectedUser?.lastName }}</h1>
        <p class="profile-email">{{ selectedUser?.email }}</p>
      </div>
    </div>

    <div class="profile-grid">

      <div class="profile-card kpet-fade-up">
        <div class="profile-card-header">
          <span class="profile-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <h3>Datos personales</h3>
        </div>

        <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit(selectedUser)">
          <div class="d-flex flex-column gap-3">
            <div>
              <label for="firstName" class="form-label fw-semibold">Nombre:</label>
              <input type="text" id="firstName" class="form-control" formControlName="firstName" [value]="selectedUser?.firstName">
            </div>
            <div>
              <label for="lastName" class="form-label fw-semibold">Apellido:</label>
              <input type="text" id="lastName" class="form-control" formControlName="lastName" [value]="selectedUser?.lastName">
            </div>
            <div>
              <label for="email" class="form-label fw-semibold">Correo:</label>
              <input type="text" id="email" class="form-control" formControlName="email" [value]="selectedUser?.email">
            </div>
            <div>
              <label for="noTel" class="form-label fw-semibold">Número de teléfono:</label>
              <input type="text" id="noTel" class="form-control" formControlName="noTel" [value]="selectedUser?.noTel">
            </div>
          </div>

          <div class="d-flex gap-2 pt-4">
            <button class="btn btn-kpet-primary" type="button" *ngIf="!isEditingInfo" (click)="onEditButtonClick()">Editar mis datos</button>
            <button class="btn btn-kpet-primary" type="button" *ngIf="isEditingInfo" (click)="onSubmit(selectedUser)">Guardar</button>
            <button class="btn btn-outline-secondary" type="button" *ngIf="isEditingInfo" (click)="cancel()">Cancelar</button>
          </div>
        </form>
      </div>

      <div class="profile-card kpet-fade-up">
        <div class="profile-card-header">
          <span class="profile-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <h3>Seguridad</h3>
        </div>

        <form [formGroup]="checkoutFormPassword" (ngSubmit)="onSubmitPassword(selectedUser)">
          <div class="d-flex flex-column gap-3">
            <div>
              <label for="password" class="form-label fw-semibold">Contraseña actual:</label>
              <div class="password-field">
                <input [type]="showCurrentPassword ? 'text' : 'password'" id="password" class="form-control" formControlName="password">
                <button type="button" class="password-toggle-btn" (click)="showCurrentPassword = !showCurrentPassword"
                        [attr.aria-label]="showCurrentPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                  <svg *ngIf="!showCurrentPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg *ngIf="showCurrentPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
                </button>
              </div>
            </div>
            <div>
              <label for="newPassword" class="form-label fw-semibold">Nueva contraseña:</label>
              <div class="password-field">
                <input [type]="showNewPassword ? 'text' : 'password'" id="newPassword" class="form-control" formControlName="newPassword">
                <button type="button" class="password-toggle-btn" (click)="showNewPassword = !showNewPassword"
                        [attr.aria-label]="showNewPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                  <svg *ngIf="!showNewPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg *ngIf="showNewPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2 pt-4">
            <button class="btn btn-kpet-primary" type="button" *ngIf="!isEditingPassword" (click)="onEditPasswordButtonClick()">Cambiar mi contraseña</button>
            <button class="btn btn-kpet-primary" type="submit" *ngIf="isEditingPassword">Guardar</button>
            <button class="btn btn-outline-secondary" type="button" *ngIf="isEditingPassword" (click)="cancel()">Cancelar</button>
          </div>
        </form>
      </div>

    </div>

    <div class="profile-actions-row kpet-fade-up">
      <button class="profile-action-btn profile-action-logout" type="button" (click)="openLogoutConfirm()">
        <span class="profile-action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </span>
        <span class="profile-action-text">
          <strong>Cerrar sesión</strong>
          <small>Salir de tu cuenta en este dispositivo</small>
        </span>
      </button>

      <button class="profile-action-btn profile-action-delete" type="button" (click)="deleteUser(selectedUser?.id)">
        <span class="profile-action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </span>
        <span class="profile-action-text">
          <strong>Eliminar cuenta</strong>
          <small>Esta acción es irreversible</small>
        </span>
      </button>
    </div>

  </div>
</div>
