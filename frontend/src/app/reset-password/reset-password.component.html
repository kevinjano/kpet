<div class="auth-page">
  <div class="auth-card kpet-fade-up">
    <a routerLink="/" class="auth-logo">
      <img [src]="resolveImageUrl(logoUrl)" alt="Kpet" class="auth-logo-img">
    </a>

    <ng-container *ngIf="!token">
      <h2>Enlace inválido</h2>
      <p class="auth-subtitle">Este enlace no es válido. Pedí uno nuevo para restablecer tu contraseña.</p>
      <button type="button" class="btn btn-kpet-primary w-100" routerLink="/forgot-password">Pedir un enlace nuevo</button>
    </ng-container>

    <ng-container *ngIf="token && !done">
      <h2>Nueva contraseña</h2>
      <p class="auth-subtitle">Elegí una nueva contraseña para tu cuenta</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group mb-3">
          <label for="reset-password" class="visually-hidden">Nueva contraseña</label>
          <input id="reset-password" type="password" formControlName="newPassword" class="form-control" placeholder="Nueva contraseña" autocomplete="new-password">
        </div>
        <div class="form-group mb-4">
          <label for="reset-password-confirm" class="visually-hidden">Confirmar contraseña</label>
          <input id="reset-password-confirm" type="password" formControlName="confirmPassword" class="form-control" placeholder="Confirmar contraseña" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-kpet-primary w-100" [disabled]="form.invalid || saving">
          {{ saving ? 'Guardando...' : 'Cambiar contraseña' }}
        </button>
      </form>
    </ng-container>

    <ng-container *ngIf="token && done">
      <h2>¡Listo!</h2>
      <p class="auth-subtitle">Tu contraseña se actualizó con éxito.</p>
      <button type="button" class="btn btn-kpet-primary w-100" routerLink="/login">Iniciar sesión</button>
    </ng-container>
  </div>
</div>
