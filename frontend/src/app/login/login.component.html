<div class="auth-page">
  <div class="auth-card kpet-fade-up">
    <a routerLink="/" class="auth-logo">
      <img [src]="resolveImageUrl(logoUrl)" alt="Kpet" class="auth-logo-img">
    </a>
    <h2>Iniciar sesión</h2>
    <p class="auth-subtitle">Bienvenido de nuevo a Kpet</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group mb-3">
        <input type="email" formControlName="email" class="form-control" placeholder="Correo electrónico" autocomplete="email">
      </div>
      <div class="form-group mb-4 password-field">
        <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-control"
               placeholder="Contraseña" autocomplete="current-password">
        <button type="button" class="password-toggle-btn" (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
      <button type="submit" class="btn btn-kpet-primary w-100 mb-2">Iniciar sesión</button>
      <button type="button" class="btn btn-fermer w-100" routerLink='/' routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Cancelar</button>
    </form>

    <p class="auth-footer">¿No tienes cuenta? <a routerLink="/register">Crear cuenta</a></p>
  </div>
</div>
