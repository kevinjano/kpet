<nav class="kpet-topbar">
  <div class="container d-flex align-items-center justify-content-between py-2">
    <a class="kpet-back-link" routerLink="/">← Volver a la tienda</a>
    <a class="kpet-logo-text-sm" routerLink="/">
      <img [src]="resolveImageUrl(settings?.logoUrl) || defaultLogoUrl" alt="Kpet" height="36">
    </a>
  </div>
</nav>

<div class="container mt-4 mb-5">
  <h1 class="blog-title kpet-fade-up">Blog Kpet</h1>
  <p class="blog-subtitle">Novedades, eventos y fotos de la familia Kpet.</p>

  <div *ngIf="posts.length === 0" class="text-center text-muted py-5">
    Todavía no hay publicaciones. ¡Vuelve pronto!
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mt-2">
    <div class="col" *ngFor="let post of posts; trackBy: trackById">
      <article class="blog-card kpet-fade-up">
        <div class="blog-card-image">
          <img *ngIf="post.imageUrl; else blogPlaceholder" [src]="resolveImageUrl(post.imageUrl)" [alt]="post.title">
          <ng-template #blogPlaceholder><span>🐾</span></ng-template>
        </div>
        <div class="blog-card-body">
          <span class="blog-date" *ngIf="post.eventDate">{{ post.eventDate | date:'d MMM y' }}</span>
          <span class="blog-date" *ngIf="!post.eventDate">{{ post.createdAt | date:'d MMM y' }}</span>
          <h2 class="blog-card-title">{{ post.title }}</h2>
          <p class="blog-card-content">{{ post.content }}</p>
        </div>
      </article>
    </div>
  </div>
</div>
