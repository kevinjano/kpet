<nav class="kpet-topbar">
  <div class="container d-flex align-items-center justify-content-between py-2">
    <a class="kpet-back-link" routerLink="/">← Volver a la tienda</a>
    <a class="kpet-logo-text-sm" routerLink="/">
      <img [src]="resolveImageUrl(settings?.logoUrl) || defaultLogoUrl" alt="Kpet" height="36">
    </a>
  </div>
</nav>

<header class="blog-hero">
  <span class="blog-hero-blob blog-hero-blob-1"></span>
  <span class="blog-hero-blob blog-hero-blob-2"></span>
  <svg class="blog-paw blog-hero-paw-1" viewBox="0 0 24 24" fill="currentColor">
    <ellipse cx="12" cy="16.5" rx="6" ry="5"/><ellipse cx="4.5" cy="9" rx="2.3" ry="3"/><ellipse cx="9.7" cy="5" rx="2.3" ry="3"/><ellipse cx="14.3" cy="5" rx="2.3" ry="3"/><ellipse cx="19.5" cy="9" rx="2.3" ry="3"/>
  </svg>
  <svg class="blog-paw blog-hero-paw-2" viewBox="0 0 24 24" fill="currentColor">
    <ellipse cx="12" cy="16.5" rx="6" ry="5"/><ellipse cx="4.5" cy="9" rx="2.3" ry="3"/><ellipse cx="9.7" cy="5" rx="2.3" ry="3"/><ellipse cx="14.3" cy="5" rx="2.3" ry="3"/><ellipse cx="19.5" cy="9" rx="2.3" ry="3"/>
  </svg>
  <div class="container">
    <h1 class="blog-title kpet-fade-up">Blog Kpet</h1>
    <p class="blog-subtitle kpet-fade-up">Novedades, eventos y fotos de la familia Kpet</p>
  </div>
</header>

<div class="blog-body">
  <svg class="blog-paw blog-body-paw-1" viewBox="0 0 24 24" fill="currentColor">
    <ellipse cx="12" cy="16.5" rx="6" ry="5"/><ellipse cx="4.5" cy="9" rx="2.3" ry="3"/><ellipse cx="9.7" cy="5" rx="2.3" ry="3"/><ellipse cx="14.3" cy="5" rx="2.3" ry="3"/><ellipse cx="19.5" cy="9" rx="2.3" ry="3"/>
  </svg>
  <svg class="blog-paw blog-body-paw-2" viewBox="0 0 24 24" fill="currentColor">
    <ellipse cx="12" cy="16.5" rx="6" ry="5"/><ellipse cx="4.5" cy="9" rx="2.3" ry="3"/><ellipse cx="9.7" cy="5" rx="2.3" ry="3"/><ellipse cx="14.3" cy="5" rx="2.3" ry="3"/><ellipse cx="19.5" cy="9" rx="2.3" ry="3"/>
  </svg>
  <div class="container mb-5">
  <app-loading-spinner *ngIf="!postsLoaded" message="Cargando publicaciones..."></app-loading-spinner>

  <div *ngIf="postsLoaded && posts.length === 0" class="text-center text-muted py-5">
    Todavía no hay publicaciones. ¡Vuelve pronto!
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let post of posts; let i = index; trackBy: trackById">
      <article class="blog-card kpet-fade-up" [class.blog-card-alt]="i % 2 === 1" [style.animation-delay.ms]="i * 70" (click)="openPost(post)">
        <div class="blog-card-image">
          <video *ngIf="post.videoUrl; else blogImage" [src]="resolveImageUrl(post.videoUrl)" muted preload="metadata"></video>
          <ng-template #blogImage>
            <img *ngIf="post.imageUrl; else blogPlaceholder" [src]="resolveImageUrl(post.imageUrl)" [alt]="post.title">
          </ng-template>
          <ng-template #blogPlaceholder>
            <svg class="blog-placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <circle cx="8.5" cy="9.5" r="1.5"/>
              <path d="m21 15-5-5L5 20"/>
            </svg>
          </ng-template>
          <span class="blog-date-badge">
            <strong>{{ (post.eventDate || post.createdAt) | date:'d' }}</strong>
            <small>{{ (post.eventDate || post.createdAt) | date:'MMM' }}</small>
          </span>
        </div>
        <div class="blog-card-body">
          <h2 class="blog-card-title">{{ post.title }}</h2>
          <p class="blog-card-content">{{ post.content }}</p>
          <span class="blog-read-more">Leer más →</span>
        </div>
      </article>
    </div>
  </div>
  </div>
</div>

<app-blog-post-detail-modal *ngIf="selectedPost" [post]="selectedPost" (close)="closePost()"></app-blog-post-detail-modal>

<app-site-footer [settings]="settings"></app-site-footer>
