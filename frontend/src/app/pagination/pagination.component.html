<div class="pagination-bar" *ngIf="totalPages > 1">
  <span class="pagination-range">{{ rangeStart }}–{{ rangeEnd }} de {{ totalItems }}</span>
  <div class="pagination-controls">
    <button type="button" (click)="goTo(currentPage - 1)" [disabled]="currentPage === 1" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="pagination-page">Página {{ currentPage }} de {{ totalPages }}</span>
    <button type="button" (click)="goTo(currentPage + 1)" [disabled]="currentPage === totalPages" aria-label="Página siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</div>
