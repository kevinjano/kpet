<div class="discount-backdrop" *ngIf="visible" (click)="close()">
  <div class="discount-modal" (click)="$event.stopPropagation()">
    <button type="button" class="discount-close" (click)="close()" aria-label="Cerrar">✕</button>

    <div class="discount-image-side" *ngIf="imageUrl" [style.backgroundImage]="'url(' + imageUrl + ')'"></div>

    <div class="discount-form-side">
      <ng-container *ngIf="!submitted; else successBlock">
        <h2 class="discount-title">¡{{ discountPercent }}% OFF<br>en tu primer pedido!</h2>
        <p class="discount-subtitle">Dejanos tus datos y te lo aplicamos automáticamente en tu primer pedido.</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="discount-field">
            <label class="discount-label" for="discountName">Nombre</label>
            <input id="discountName" type="text" class="discount-input" placeholder="Nombre" formControlName="name">
          </div>
          <div class="discount-field">
            <label class="discount-label" for="discountEmail">Correo</label>
            <input id="discountEmail" type="email" class="discount-input" placeholder="Correo" formControlName="email">
          </div>
          <div class="discount-field">
            <label class="discount-label" for="discountPetName">Nombre de tu mascota</label>
            <input id="discountPetName" type="text" class="discount-input" placeholder="Nombre de tu mascota" formControlName="petName">
          </div>
          <div class="discount-field">
            <label class="discount-label" for="discountPetBirthday">Cumpleaños de tu mascota</label>
            <input id="discountPetBirthday" type="date" class="discount-input" formControlName="petBirthday">
          </div>
          <button type="submit" class="discount-submit" [disabled]="form.invalid || submitting">
            {{ submitting ? 'Enviando...' : 'Obtener descuento' }}
          </button>
        </form>
      </ng-container>

      <ng-template #successBlock>
        <h2 class="discount-title">¡Listo!</h2>
        <p class="discount-subtitle">Tu descuento del {{ discountPercent }}% se aplica automáticamente en tu primer pedido — no necesitás ningún código.</p>
        <button type="button" class="discount-submit" (click)="close()">Empezar a comprar</button>
      </ng-template>
    </div>
  </div>
</div>
