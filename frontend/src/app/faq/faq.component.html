<nav class="kpet-topbar">
  <div class="container d-flex align-items-center justify-content-between py-2">
    <a class="kpet-back-link" routerLink="/">← Volver a la tienda</a>
    <a class="kpet-logo-text-sm" routerLink="/">
      <img [src]="resolveImageUrl(settings?.logoUrl) || defaultLogoUrl" alt="Kpet" height="36">
    </a>
  </div>
</nav>

<header class="faq-hero">
  <span class="faq-hero-blob faq-hero-blob-1"></span>
  <span class="faq-hero-blob faq-hero-blob-2"></span>
  <div class="container">
    <h1 class="faq-title kpet-fade-up">Preguntas frecuentes</h1>
    <p class="faq-subtitle kpet-fade-up">Todo lo que necesitas saber antes de comprar</p>
  </div>
</header>

<div class="faq-body">
  <div class="container mb-5">
    <div *ngIf="faqs.length === 0" class="text-center text-muted py-5">
      Todavía no hay preguntas cargadas.
    </div>

    <div class="faq-list">
      <div class="faq-item kpet-fade-up" *ngFor="let faq of faqs; let i = index; trackBy: trackById" [style.animation-delay.ms]="i * 60">
        <button type="button" class="faq-question" [class.open]="openId === faq.id" (click)="toggle(faq.id)" [attr.aria-expanded]="openId === faq.id">
          <span>{{ faq.question }}</span>
          <svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="faq-answer" *ngIf="openId === faq.id">
          <p>{{ faq.answer }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
