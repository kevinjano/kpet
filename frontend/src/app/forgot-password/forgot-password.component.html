<div class="auth-page">
  <div class="auth-card kpet-fade-up">
    <a routerLink="/" class="auth-logo">
      <img [src]="resolveImageUrl(logoUrl)" alt="Kpet" class="auth-logo-img">
    </a>

    <ng-container *ngIf="!submitted; else doneMessage">
      <h2>Recuperar contraseña</h2>
      <p class="auth-subtitle">Te mandamos un enlace a tu correo para elegir una nueva</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group mb-4">
          <label for="forgot-email" class="visually-hidden">Correo electrónico</label>
          <input id="forgot-email" type="email" formControlName="email" class="form-control" placeholder="Correo electrónico" autocomplete="email">
        </div>
        <button type="submit" class="btn btn-kpet-primary w-100 mb-2" [disabled]="form.invalid || sending">
          {{ sending ? 'Enviando...' : 'Enviar enlace' }}
        </button>
        <button type="button" class="btn btn-fermer w-100" routerLink="/login">Cancelar</button>
      </form>
    </ng-container>

    <ng-template #doneMessage>
      <h2>Revisá tu correo</h2>
      <p class="auth-subtitle">Si el correo está registrado, te llegará un enlace para restablecer tu contraseña. Puede tardar unos minutos.</p>
      <button type="button" class="btn btn-kpet-primary w-100" routerLink="/login">Volver a iniciar sesión</button>
    </ng-template>

    <p class="auth-footer">¿Ya te acordaste? <a routerLink="/login">Iniciar sesión</a></p>
  </div>
</div>
