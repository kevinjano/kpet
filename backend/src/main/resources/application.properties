# =============== DATASOURCE =================
# Define the URL to your database
spring.datasource.url=jdbc:mysql://localhost:3306/kpet?createDatabaseIfNotExist=true
# Username/password read from DB_USERNAME/DB_PASSWORD environment variables when
# set (e.g. on your production host); the values after the colon are only the
# local-dev fallback so nothing breaks when those env vars aren't set. NEVER put
# your real production DB password here directly — set it as an env var on the
# host instead, and use a DIFFERENT password there than this local dev one.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:projetfinal1234}

# =============== JPA/HIBERNATE =================
# Specify the JPA provider. In this case, we're using Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Automatically update the database schema to match entities without dropping existing data
# (create-drop was only for early development — it wipes everything on every restart)
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.port=8090

# =============== SECURITY =================
# Signing key for login tokens (JWT). This default is fine for local dev, but
# set a long random JWT_SECRET env var on your production host — anyone who
# knows this value can forge admin tokens. Generate one with, e.g.,
# `openssl rand -base64 48`.
app.jwt.secret=${JWT_SECRET:kpet-local-dev-secret-change-me-before-deploying-to-production-please-1234567890}
# Login sessions expire after this many ms (default: 24h)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Only this origin is allowed to call the API from a browser. Update this (as
# an env var on your host) once you have a real domain, e.g. https://kpet.com —
# otherwise your deployed frontend won't be able to reach the API.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# =============== FILE UPLOADS =================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE 

# Show SQL statements in the console (useful for development/debugging)
spring.jpa.show-sql=false 
spring.jpa.defer-datasource-initialization=true
spring.data.jpa.repositories.enabled=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

# =============== THYMELEAF =================
# By default, Thymeleaf templates will be cached. Set this to false during development
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=false

# =============== LOGGER =================
# logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
#logging.level.org.springframework=DEBUG




