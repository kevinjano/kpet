# Test-only config — Spring Boot loads this instead of src/main/resources'
# application.properties for anything on the test classpath, so tests never
# touch the real MySQL database. An in-memory H2 instance is created fresh
# for each test run (MODE=MySQL keeps most syntax differences from mattering).
spring.datasource.url=jdbc:h2:mem:kpet-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=kpet-test-secret-not-used-in-production-1234567890
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=http://localhost:4200
app.upload.dir=uploads-test
