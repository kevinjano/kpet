# Local dev only — a fast(er) stand-in for real production hosting
# (PHP-FPM with opcache, behind nginx) so testing on this machine doesn't
# feel artificially slow the way `php artisan serve` does. Run from
# backend-php/: docker compose -f .dev/docker-compose.yml up -d
# Stop with:                    docker compose -f .dev/docker-compose.yml down
services:
  php-fpm:
    build:
      context: ..
      dockerfile: .dev/Dockerfile.fpm
    volumes:
      - ..:/app
    networks:
      - backend_default

  nginx:
    image: nginx:alpine
    ports:
      - "8091:8091"
    volumes:
      - ..:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    networks:
      - backend_default

networks:
  backend_default:
    external: true
