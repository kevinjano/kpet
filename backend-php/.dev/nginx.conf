server {
    listen 8091;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Local-dev-only: frontend (4200) and backend (8091) are different
    # origins here, so static image responses need a CORS header or Chrome's
    # ORB blocks them — same fix as public/uploads/.htaccess, just nginx's
    # own syntax for it since nginx never reads .htaccess files.
    location /uploads/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
